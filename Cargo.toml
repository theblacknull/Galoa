[workspace]
resolver = "2"
members = [
    "crates/galoa-core",
    "crates/galoa-index",
    "crates/galoa-ingest",
    "crates/galoa-ctrader",
    "crates/galoa-raft",
    "crates/galoa",
]
default-members = ["crates/galoa"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/theblacknull/Galoa"

[workspace.dependencies]
galoa-core = { path = "crates/galoa-core" }
galoa-index = { path = "crates/galoa-index" }
galoa-ingest = { path = "crates/galoa-ingest" }
galoa-ctrader = { path = "crates/galoa-ctrader" }
galoa-raft = { path = "crates/galoa-raft" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rustfft = "6"
